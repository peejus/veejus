<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Veejus app icon. Source for build/icon.png: npm run icon -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1840"/>
      <stop offset="1" stop-color="#0c0b12"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5ce4"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="shadow" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" color-interpolation-filters="sRGB" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#tile)">
    <!-- Beat rings pulsing out from the point of the V. -->
    <g fill="none" stroke="#ff2bd6" stroke-width="10">
      <circle cx="512" cy="700" r="230" opacity="0.30"/>
      <circle cx="512" cy="700" r="340" opacity="0.18"/>
      <circle cx="512" cy="700" r="450" opacity="0.09"/>
    </g>

    <!-- Glow behind the letter. -->
    <path d="M330 320 L512 700 L694 320" fill="none" stroke="#ff2bd6" stroke-width="120"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.55" filter="url(#glow)"/>

    <!-- Cyan offset copy (the RGB-split look), then the pink V on top. -->
    <path d="M308 306 L490 686 L672 306" fill="none" stroke="#29d9ff" stroke-width="120"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M330 320 L512 700 L694 320" fill="none" stroke="url(#pink)" stroke-width="120"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Hairline edge. -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff"
        stroke-opacity="0.08" stroke-width="2"/>
</svg>
